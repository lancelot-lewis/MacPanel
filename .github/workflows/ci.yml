name: CI

# 目标平台：darwin/arm64（Apple Silicon）。本项目是 macOS 专属
# （internal/platform/darwin 仅在 darwin 下编译），且二进制内嵌前端产物，
# 因此必须在 macOS runner 上原生构建。
#
# 触发与产物：
#   PR           → 只做编译（make build）+ 检查（make check），不产安装包
#   push 到 main → 额外构建未签名 PKG，并以 artifact 交付（文件名带短 SHA）
#
# 为什么不再单独上传裸二进制：裸二进制会把人推进 dev 路径（手工 token / agent / server，
# 且非 root 下 PF、计划重启、launchd 全部残废）。能安装的安装包才是真实使用形态。
#
# 为什么是单 job 而不是 build / test 两个并行：两者都要跑 npm ci + 前端构建，
# macOS 分钟数按 Linux 的倍数计费，拆开等于把最贵的一段烧两遍。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Build & Test & Package
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 让 git describe 能拿到 tag / 历史以注入版本号
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build
        # 先构建前端生成 web/dist 再编译二进制：web 包用 //go:embed all:dist 内嵌产物，
        # 缺 dist 时 go 在编译期就报 "pattern all:dist: no matching files found"。
        run: make build

      - name: Check (lint + test + web typecheck)
        run: make check

      # 以下仅在 push 到 main 时执行。
      - name: Package (unsigned PKG)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # 版本号用 run_number 保证每次构建都递增：同版本覆盖安装会触发 macOS 的
        # receipt-based obsoleting，实测会在安装完成后把 payload 里的文件删掉
        # （launchd plist 消失 → 服务起不来）。递增后走的是正常升级路径。
        env:
          MACPANEL_PKG_VERSION: 0.1.${{ github.run_number }}
        run: make pkg

      - name: Verify PKG structure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: make verify-pkg

      - name: Resolve artifact name
        id: meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # 没有 tag 时 build-pkg.sh 把版本号固化为 0.1.0，所有构建同名、无法区分，
        # 因此把短 SHA 放进 artifact 名（真正的溯源依据是 `macpanel version`）。
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload PKG artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: MacPanel-${{ steps.meta.outputs.short }}-arm64
          path: MacPanel-*.pkg
          if-no-files-found: error
